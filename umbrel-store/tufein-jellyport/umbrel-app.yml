id: tufein-jellyport
category: media
name: JellyPort
version: "2.1.0"
tagline: Van download naar je Jellyfin-bibliotheek
description: >-
  JellyPort verbindt je zoekbronnen en torrent-downloader (Transmission of qBittorrent) met je
  bestaande Jellyfin- of Plex-mappen. Zoek een titel, start de download en voltooide films en
  series worden automatisch in de juiste map geplaatst en je bibliotheek wordt gescand.


  Je kiest zelf je bronnen; JellyPort levert geen content en heeft geen abonnement.
