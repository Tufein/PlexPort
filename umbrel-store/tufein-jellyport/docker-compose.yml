version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tufein-jellyport_web_1
      APP_PORT: 8765
      # JellyPort heeft een eigen wachtwoordscherm; het wachtwoord staat in de Umbrel-app.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/tufein/jellyport:2.1.0
    restart: on-failure
    environment:
      JELLYPORT_HOST: "0.0.0.0"
      JELLYPORT_PORT: "8765"
      JELLYPORT_PASSWORD: ${APP_PASSWORD}
      JELLYPORT_DATA: /data
      JELLYPORT_DOWNLOADS: /downloads
      JELLYPORT_MEDIA: /media
      DOWNLOADER_TYPE: transmission
      # Umbrel's Transmission-app; pas het adres aan als je het anders bereikt.
      TRANSMISSION_URL: http://umbrel.local:9091/transmission/rpc
      DOWNLOADER_ROOT: /downloads
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Dezelfde gedeelde downloadmap als in Umbrel's Transmission (/downloads).
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
      # Films staan in /downloads/movies. Maak de map voor series zelf aan (tv) als je die wilt gebruiken.
      - ${UMBREL_ROOT}/data/storage/downloads/movies:/media/Movies
      - ${UMBREL_ROOT}/data/storage/downloads/tv:/media/TV Shows
