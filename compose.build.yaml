# JellyPort op je NAS, met je bestaande qBittorrent.
services:
  jellyport:
    build: .
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      JELLYPORT_PASSWORD: ${JELLYPORT_PASSWORD:?Vul JELLYPORT_PASSWORD in .env in}
      DOWNLOADER_TYPE: transmission
      TRANSMISSION_URL: ${TRANSMISSION_URL:-http://192.168.1.75:9091/transmission/rpc}
      DOWNLOADER_ROOT: ${TRANSMISSION_DOWNLOAD_ROOT:-/downloads}
    volumes:
      - ./data:/data
      - type: bind
        source: ${DOWNLOADS_PATH:-./downloads}
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_PATH:-./media}
        target: /media
        bind:
          create_host_path: false
