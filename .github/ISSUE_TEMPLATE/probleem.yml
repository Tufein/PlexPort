name: Report a problem
description: Tell us what you see in plain language. No technical knowledge needed.
title: "Problem: "
body:
  - type: markdown
    attributes:
      value: "This report is public. Do not share passwords, tokens or complete settings files."
  - type: dropdown
    id: apparaat
    attributes:
      label: Where do you use PlexPort?
      options:
        - TrueNAS
        - Another NAS
        - Mac
        - Another computer
        - Android
    validations:
      required: true
  - type: textarea
    id: gebeurd
    attributes:
      label: What were you trying to do, and what happened?
      placeholder: "For example: I clicked Start download, but saw a message about the movie folder."
    validations:
      required: true
  - type: textarea
    id: melding
    attributes:
      label: What message do you see?
      description: Copy only the relevant message and remove private information.
  - type: textarea
    id: controle
    attributes:
      label: What does Check everything report?
      description: In the current Dutch interface, open Instellingen (Settings) and click Alles controleren (Check everything).
