name: Suggest a feature
description: What would make PlexPort easier for you to use?
title: "Idea: "
body:
  - type: textarea
    id: behoefte
    attributes:
      label: What would you like to do?
      placeholder: Describe what you want to achieve. You do not need to design a technical solution.
    validations:
      required: true
  - type: textarea
    id: vandaag
    attributes:
      label: How do you do this today?
      description: What gets in your way?
